# Deploy the Anvil backend on Render's free plan (https://render.com).
# Data lives in Postgres (e.g. a free Neon database): set DATABASE_URL.
# After deploying, paste the service URL into the app: Settings → Sync server.
services:
  - type: web
    name: day84-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_WEB_BASE
        sync: false
